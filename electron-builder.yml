# electron-builder 打包配置（npm run dist:win / dist:mac）
# 产物在 release/ 目录：安装包 + latest.yml / latest-mac.yml（更新用的版本清单）+ .blockmap（差量更新用）
appId: ai.a.desktop
productName: A.ai
copyright: A.ai
directories:
  output: release
  buildResources: build

# 安装包里的 app.asar 放打包后的主进程、preload 和本地窗口页，不带 node_modules。
files:
  - dist-electron/**
  - package.json
  - "!node_modules/**"

# Windows 更新下载和 NSIS 安装基线使用同一个集中缓存目录。
beforePack: scripts/electron-before-pack.cjs
# 独立 HTTP 服务和 Web 静态资源放在 resources/server，由 afterPack 拷入生产依赖。
afterPack: scripts/electron-after-pack.cjs
# 服务的生产依赖由工作区部署单独安装，app.asar 里只包含主进程入口。
npmRebuild: false

# 更新源：你自己的服务器上一个能用浏览器访问的目录，把 release/ 里的文件传上去
# 打包前设置环境变量 A_UPDATE_URL，例：https://你的域名/a-ai-updates/
publish:
  provider: generic
  url: ${env.A_UPDATE_URL}
  useMultipleRangeRequest: false # A.ai 更新接口支持单段 Range

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: A.ai-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false # 装到当前用户目录（%LOCALAPPDATA%\Programs\A.ai），不需要管理员权限
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: A.ai
  deleteAppDataOnUninstall: false # 卸载时保留聊天记录和设置

mac:
  target:
    - dmg
    - zip # 自动更新在 macOS 上用 zip
  category: public.app-category.productivity
  artifactName: A.ai-${version}-${arch}.${ext}

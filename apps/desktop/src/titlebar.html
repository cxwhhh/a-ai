<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
  <title>A.ai</title>
  <style>
    :root {
      --surface: #f5f5f6;
      --fg: #111113;
      --muted: #52525b;
      --hover: #eaeaed;
      --edge: rgba(0, 0, 0, .085);
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --surface: #18181b;
      --fg: #ececee;
      --muted: #a1a1aa;
      --hover: #252529;
      --edge: rgba(255, 255, 255, .075);
      color-scheme: dark;
    }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--surface);
      color: var(--fg);
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .titlebar {
      display: flex;
      align-items: center;
      gap: 8px;
      box-sizing: border-box;
      width: env(titlebar-area-width, 100%);
      height: 36px;
      margin-inline-start: env(titlebar-area-x, 0px);
      padding-inline: 8px;
      border-bottom: 1px solid var(--edge);
      app-region: drag;
      user-select: none;
    }
    .name { font-weight: 600; }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 27px;
      padding: 0 8px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
      app-region: no-drag;
    }
    button:hover, button[aria-expanded="true"] { background: var(--hover); color: var(--fg); }
    button:focus-visible { outline: 1px solid var(--muted); outline-offset: -1px; }
    #application { width: 28px; padding: 0; }
    #environment { margin-inline-start: 4px; }
    svg { display: block; flex: none; }
  </style>
</head>
<body>
  <header class="titlebar" aria-label="A.ai 窗口栏">
    <button id="application" type="button" aria-label="应用菜单" aria-haspopup="menu" aria-expanded="false" title="应用菜单 F10">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
        <path d="M3 4.5h10M3 8h10M3 11.5h10" />
      </svg>
    </button>
    <span class="name">A.ai</span>
    <button id="environment" type="button" aria-haspopup="menu" aria-expanded="false" title="切换运行环境">
      <span>运行环境</span>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m3 4.5 3 3 3-3" />
      </svg>
    </button>
  </header>
</body>
</html>
